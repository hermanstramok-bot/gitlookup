services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingvo_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: lingvo_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: "postgresql://lingvo_user:password123@db:5432/lingvo_db"
    depends_on:
      - db
    volumes:
      - server_uploads:/app/uploads
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
  server_uploads: